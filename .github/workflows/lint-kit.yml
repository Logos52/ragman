name: lint-kit

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kit-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ragman]
    timeout-minutes: 20
    env:
      LINT_KIT_PIN: 11b2880e890ba1525775843e3f6027e729afbe25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install lint-kit
        env:
          LINT_KIT_DEPLOY_KEY: ${{ secrets.LINT_KIT_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          pin="$LINT_KIT_PIN"
          src="$RUNNER_TEMP/lint-kit-src"
          mirror="/home/box/mirrors/lint-kit.git"
          key_file="$RUNNER_TEMP/lint-kit-deploy-key"
          rm -f "$key_file"
          trap 'rm -f "$key_file"' EXIT

          clone_pin() {
            local url="$1"
            rm -rf "$src"
            if ! git -c "safe.directory=$url" clone --quiet "$url" "$src"; then
              return 1
            fi
            if ! git -C "$src" checkout --quiet --detach "$pin"; then
              return 1
            fi
            local got
            got="$(git -C "$src" rev-parse HEAD)"
            if [ "$got" != "$pin" ]; then
              echo "::error::refusing commit ${got}; lint-kit pin is ${pin}"
              exit 1
            fi
          }

          cloned=0
          if [ -n "${LINT_KIT_DEPLOY_KEY:-}" ]; then
            umask 077
            printf '%s\n' "$LINT_KIT_DEPLOY_KEY" > "$key_file"
            export GIT_SSH_COMMAND="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/known_hosts"
            if clone_pin "git@github.com:Logos52/lint-kit.git"; then
              cloned=1
            else
              echo "deploy-key install failed; falling back to ${mirror}"
              unset GIT_SSH_COMMAND
            fi
          else
            echo "LINT_KIT_DEPLOY_KEY is unset; using ${mirror}"
          fi
          if [ "$cloned" -ne 1 ]; then
            if [ ! -e "$mirror" ]; then
              echo "::error::no lint-kit deploy key and box mirror ${mirror} is missing"
              exit 1
            fi
            clone_pin "$mirror"
          fi
          rm -f "$key_file"

          # A path install omits devDependencies, so tsc is missing. Install the
          # pinned clone as a git dependency, the same way the GitHub URL does.
          npm install --prefix "$RUNNER_TEMP/lint-kit" --install-strategy=nested --no-save --no-package-lock "git+file://${src}#${pin}"
          installed="$RUNNER_TEMP/lint-kit/node_modules/lint-kit"
          if [ -d "$installed/.git" ]; then
            got="$(git -C "$installed" rev-parse HEAD)"
            if [ "$got" != "$pin" ]; then
              echo "::error::refusing commit ${got}; lint-kit pin is ${pin}"
              exit 1
            fi
          fi
          npm --prefix "$installed" run build
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::error::python3 is not installed on the runner"
            exit 1
          fi
          python3 --version
          venv="$RUNNER_TEMP/lint-kit-venv"
          req="$RUNNER_TEMP/lint-kit/node_modules/lint-kit/requirements.txt"
          if python3 -m venv "$venv"; then
            "$venv/bin/python" -m pip install --upgrade pip
            "$venv/bin/python" -m pip install -r "$req"
            echo "$venv/bin" >> "$GITHUB_PATH"
          else
            python3 -m pip install --user --break-system-packages -r "$req"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Prune baseline
        run: |
          mkdir -p node_modules/.bin
          ln -sfn "$RUNNER_TEMP/lint-kit/node_modules/.bin/kit" node_modules/.bin/kit
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --depth 1 origin "$GITHUB_BASE_REF"
          fi
          npx kit baseline --prune
          cp .lint-kit-baseline.json "$RUNNER_TEMP/lint-kit-baseline.upload.json"
          node -e "const b=require('./.lint-kit-baseline.json'); console.log('baseline entries', Array.isArray(b.entries)?b.entries.length:b.entries)"
      - uses: actions/upload-artifact@v4
        with:
          name: lint-kit-baseline
          path: ${{ runner.temp }}/lint-kit-baseline.upload.json
          if-no-files-found: error
      - name: Check
        run: |
          mkdir -p node_modules/.bin
          ln -sfn "$RUNNER_TEMP/lint-kit/node_modules/.bin/kit" node_modules/.bin/kit
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --depth 1 origin "$GITHUB_BASE_REF"
          fi
          set +e
          set -o pipefail
          npx kit check | tee "$RUNNER_TEMP/kit-check.txt"
          status=${PIPESTATUS[0]}
          {
            echo "## kit check"
            echo
            echo "baseline lines: $(grep -c '^baseline ' "$RUNNER_TEMP/kit-check.txt" || true)"
            echo
            echo "warn lines: $(grep -c '^warn ' "$RUNNER_TEMP/kit-check.txt" || true)"
            echo
            echo "summary:"
            echo
            grep '^summary ' "$RUNNER_TEMP/kit-check.txt" || true
            echo
            echo '```'
            cat "$RUNNER_TEMP/kit-check.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
